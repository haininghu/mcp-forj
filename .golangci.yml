version: "2"

# Only linters that can find bugs or security issues, no style linters.
# gosec and gocritic run with every rule; silence a false positive at its site
# with //nolint:<linter> // <rule>: <reason> instead of disabling the rule.
# mcp-forj deliberately disables the gocritic style/performance checks and
# govet's shadow analyzer, which flag idiomatic Go here without finding bugs.
linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - contextcheck
    - durationcheck
    - errchkjson
    - errorlint
    - exhaustive
    - fatcontext
    - gocheckcompilerdirectives
    - gocritic
    - gosec
    - makezero
    - musttag
    - nilerr
    - nilnesserr
    - noctx
    - nosprintfhostport
    - reassign
    - wastedassign
  settings:
    errcheck:
      check-type-assertions: true
    govet:
      enable-all: true
      disable:
        - fieldalignment # memory layout, not correctness
        - findcall # demo analyzer
        - shadow # flags idiomatic `if err := ...; err != nil` scoping
    staticcheck:
      checks: ["SA*"] # bug checks only; S, ST and QF are style
    gocritic:
      enable-all: true
      disabled-checks:
        - importShadow # test helpers shadow imported package names
        - builtinShadow
        - hugeParam # value params are intentional; not worth a pointer API
        - rangeValCopy
        - httpNoBody
        - emptyStringTest
    exhaustive:
      default-signifies-exhaustive: true
    fatcontext:
      check-struct-pointers: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
