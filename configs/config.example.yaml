# Example configuration for mcp-forj.
# Copy to configs/config.yaml and adjust. The real config is git-ignored.
#
# `token` may be a literal secret or reference environment variables with
# ${NAME}. Prefer ${NAME} so no secret is written into the file.

server:
  name: mcp-forj
  log_level: info          # debug | info | warn | error
  noai:
    marker_file: .noai     # repository marker for the capability default-deny
    # .noai is a capability-level default-deny overlay: on a .noai repository
    # EVERY capability is denied unless its grant is explicitly exempted with
    # `noai: allow` (see the capabilities below). The marker is checked on the
    # default branch, fail-closed, on every non-exempt operation (no caching).
    # The provider token below MUST be able to read repository files on the
    # default branch, otherwise non-exempt operations fail closed.

providers:
  # A GitLab instance. Add more entries for more instances.
  - name: gitlab-work
    type: gitlab
    base_url: https://gitlab.example.com
    token: "${GITLAB_WORK_TOKEN}"
    request_timeout: 30s
    # Which projects repository discovery may see:
    #   accessible (default) - public/internal/group access plus member
    #   membership           - only projects the token's user is a member of
    project_scope: accessible
    # Access is deny-by-default; only the rules below grant anything.
    rules:
      # Inspect and comment on MRs, but do not read source or change anything.
      - repositories:
          - "team/service-a"
          - "team/service-b"
        effect: allow
        capabilities:
          # `noai: allow` exempts this capability from the .noai default-deny
          # overlay; on a .noai repository it would otherwise be denied.
          - mr:read:
              noai: allow
          # A capability may carry a tag filter. For MR capabilities the tags
          # are GitLab labels; for repo capabilities they are project topics.
          # The subject must have ALL `require` tags and NONE of the `exclude`
          # tags. Matching is exact and case-sensitive.
          - mr:comment:
              require: [ai-reviewed]
              exclude: [do-not-touch]
          # Trigger a rebase only for review-approved MRs.
          - mr:rebase:
              require: [ai-reviewed]

      # Read-only access to all other repositories in this group.
      - repositories:
          - "team/*"
        effect: allow
        capabilities:
          - mr:read

      # Discover and read archived repositories whose project has the `ai-ok`
      # topic. The repo:list filter also applies to literal repositories listed
      # in this rule; without an active filter they are returned without any
      # provider call. Topics are matched exactly (no caching).
      - repositories:
          - "team/ai-service"
          - "archive/**"
        effect: allow
        capabilities:
          - repo:list:
              require: [ai-ok]
          # repo:read may also restrict which files are readable. Path globs
          # (doublestar) match the repository-relative path; exclude wins over
          # include, and an active path filter fails closed on an empty path.
          - repo:read:
              paths:
                include: ["docs/**", "*.md"]
                exclude: ["**/.env", "**/secrets/**"]
          - mr:read
          # Read file diffs for review-approved MRs only. Diffs are MR metadata
          # and are not affected by the `.noai` marker.
          - mr:diff:
              require: [ai-reviewed]

      # Explicit denial (overrides anything broader that might follow). Deny
      # rules must not list capabilities.
      - repositories:
          - "legacy/**"
        effect: deny
