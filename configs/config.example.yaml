# Example configuration for mcp-forj.
# Copy to configs/config.yaml and adjust. The real config is git-ignored.
#
# `token` may be a literal secret or reference environment variables with
# ${NAME}. Prefer ${NAME} so no secret is written into the file.

server:
  name: mcp-forj
  log_level: info          # debug | info | warn | error
  noai:
    marker_file: .noai     # repository marker for the capability default-deny
    # .noai is a capability-level default-deny overlay: on a .noai repository
    # EVERY capability is denied unless its grant is explicitly exempted with
    # `noai: allow` (see the capabilities below). The marker is checked on the
    # default branch, fail-closed, on every non-exempt operation (no caching).
    # The provider token below MUST be able to read repository files on the
    # default branch, otherwise non-exempt operations fail closed.

  # Git smart-HTTP reverse proxy (optional, disabled by default). It serves
  # "git clone/fetch/push" at
  #   <public_url>/git/<provider>/<repo>.git/...
  # where <repo> is the namespace/project path. Fetch requires repo:read and
  # push requires repo:write from the provider rules below; `.noai` is enforced
  # as always. Which branches may be pushed is NOT a proxy setting: it is the
  # `branches` filter of the repo:write grant (see the rules below). The proxy
  # additionally never allows the default branch, never deletes branches, and
  # only accepts fast-forwards.
  # git_proxy:
  #   enabled: true
  #   listen: 127.0.0.1:8417             # bind address (defaults to this)
  #   public_url: https://git.example.com # absolute http(s) URL clients use
  #   # token is OPTIONAL and selects the mode:
  #   #   with token    - clients authenticate via HTTP Basic (username ignored,
  #   #                   password = token); non-loopback binds become possible.
  #   #   without token - the proxy binds loopback ONLY and requires no
  #   #                   authentication; git_remote then reports auth.type
  #   #                   "none". A non-loopback listen without token is a
  #   #                   config error.
  #   token: "${GIT_PROXY_TOKEN}"         # HTTP Basic password (username is ignored)
  #   # TLS is optional; set both or neither. Plain HTTP without TLS is only
  #   # allowed on a loopback listen address; any other bind refuses to start
  #   # unless allow_insecure is set explicitly (the Basic-auth token would
  #   # otherwise cross the network in clear text).
  #   allow_insecure: false               # explicit opt-in for plain HTTP on non-loopback
  #   tls_cert: /etc/tls/git-proxy.crt
  #   tls_key: /etc/tls/git-proxy.key

providers:
  # A GitLab instance. Add more entries for more instances.
  - name: gitlab-work
    type: gitlab
    base_url: https://gitlab.example.com
    token: "${GITLAB_WORK_TOKEN}"
    request_timeout: 30s
    # Which projects repository discovery may see:
    #   accessible (default) - public/internal/group access plus member
    #   membership           - only projects the token's user is a member of
    project_scope: accessible
    # Access is deny-by-default; only the rules below grant anything.
    rules:
      # Inspect and comment on MRs, but do not read source or change anything.
      - repositories:
          - "team/service-a"
          - "team/service-b"
        effect: allow
        capabilities:
          # `noai: allow` exempts this capability from the .noai default-deny
          # overlay; on a .noai repository it would otherwise be denied.
          - mr:read:
              noai: allow
          # policy:read exposes this provider's configured rules through
          # list_configured_rules; without it the policy is not disclosed.
          - policy:read
          # A capability may carry a tag filter. For MR capabilities the tags
          # are GitLab labels; for repo capabilities they are project topics.
          # The subject must have ALL `require` tags and NONE of the `exclude`
          # tags. Matching is exact and case-sensitive.
          - mr:comment:
              require: [ai-reviewed]
              exclude: [do-not-touch]
          # Trigger a rebase only for review-approved MRs.
          - mr:rebase:
              require: [ai-reviewed]
          # Merge review-approved MRs. This is a separate, least-privilege
          # capability (not the reserved mr:write) and is denied on `.noai`
          # repositories unless the grant is exempted with `noai: allow`.
          - mr:merge:
              require: [ai-reviewed]

      # Git push via the proxy for one playground repository. `branches` is a
      # doublestar filter on the push TARGET BRANCH and is accepted ONLY on
      # repo:write: every unique target branch of a push must match
      # branches.include (when non-empty) and must not match branches.exclude.
      # A repo:write grant WITHOUT a branches filter allows NO push at all
      # (fail-closed) — there is no global proxy allowlist any more. The proxy
      # still never pushes the default branch, never deletes, and requires
      # fast-forwards. Rules are first-match-wins, so this specific rule must
      # come BEFORE the broader "team/*" rule below.
      - repositories:
          - "team/ai-playground"
        effect: allow
        capabilities:
          - repo:read
          - repo:write:
              branches:
                include: ["ai/**"]
                exclude: ["ai/wip/**"]

      # Read-only access to all other repositories in this group.
      - repositories:
          - "team/*"
        effect: allow
        capabilities:
          - mr:read

      # Discover and read archived repositories whose project has the `ai-ok`
      # topic. The repo:list filter also applies to literal repositories listed
      # in this rule; without an active filter they are returned without any
      # provider call. Topics are matched exactly (no caching).
      - repositories:
          - "team/ai-service"
          - "archive/**"
        effect: allow
        capabilities:
          - repo:list:
              require: [ai-ok]
          # repo:read may also restrict which files are readable. Path globs
          # (doublestar) match the repository-relative path; exclude wins over
          # include, and an active path filter fails closed on an empty path.
          # NOTE: the git proxy cannot enforce path filters (a fetch is
          # whole-tree), so an ACTIVE paths filter switches off GIT access for
          # this capability as well: fetch/clone and push deny fail-closed.
          - repo:read:
              paths:
                include: ["docs/**", "*.md"]
                exclude: ["**/.env", "**/secrets/**"]
          - mr:read
          # Read file diffs for review-approved MRs only. Diffs are MR metadata
          # and are not affected by the `.noai` marker.
          - mr:diff:
              require: [ai-reviewed]

      # Explicit denial (overrides anything broader that might follow). Deny
      # rules must not list capabilities.
      - repositories:
          - "legacy/**"
        effect: deny
